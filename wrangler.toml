name = "reader"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat_v2"]

assets = { directory = "dist", binding = "ASSETS", run_worker_first = [
  "/*"] }

routes = [
  { pattern = "read.significanthobbies.com", custom_domain = true }
]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[ai]
binding = "AI"

[vars]
NODE_ENV = "production"
BETTER_AUTH_URL = "https://read.significanthobbies.com"
AUTH0_ISSUER = "https://dev-0suel086hm1blvg7.us.auth0.com/"
AUTH0_MCP_AUDIENCE = "https://mcp.significanthobbies.com/reader/mcp"

[[r2_buckets]]
binding = "PDFS_BUCKET"
bucket_name = "reader-pdfs"

[[d1_databases]]
binding = "DB"
database_name = "reader"
database_id = "f59f66af-79d1-4c2d-be34-fbdf20ed8da6"
preview_database_id = "fb70ecb4-ff51-413f-9b21-d87456a97a9d"
migrations_dir = "drizzle"
